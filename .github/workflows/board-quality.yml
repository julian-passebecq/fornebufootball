name: Board quality
on:
  push:
    branches: [main, fix/mobile-coach-final-20260913]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: board-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Browser regression tests
        run: npm run test:e2e
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-evidence
          path: |
            dist
            test-results
            playwright-report
            package-lock.json
          if-no-files-found: ignore
          retention-days: 7
